name: web-search
description: Search the web and return ranked results with titles, URLs, and snippets using DuckDuckGo Lite (fast, headless-friendly)
params:
  - name: query
    description: Search query
    required: true
  - name: count
    description: Number of results to extract
    default: "5"
url: "https://html.duckduckgo.com/html/?q={{query}}"
instructions:
  - extract the top {{count}} results from the results list; for each result include title, URL, and snippet
